[package]
name = "n4n5"
version = "1.6.11"
edition = "2024"
description = "n4n5's utility crate"
documentation = "https://docs.rs/n4n5"
license = "MIT"
readme = "./README.md"
keywords = ["utility"]
categories = ["command-line-utilities"]
repository = "https://github.com/Its-Just-Nans/n4n5-utilities"
workspace = "../"

[dependencies]
clap = { version = "4.6", features = ["cargo", "derive"] }
env_logger = "0.11"
home = "0.5.12"
log = "0.4"
music-exporter = { version = "1.1.7", path = "../music-exporter/" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
toml = "1.1"
clap_complete = "4.6"
clap_mangen = "0.3"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
galion = { version = "0.7.8", optional = true }
git-mover = { version = "1.2.5", path = "../git-mover/", optional = true }
n4n5-share = { version = "1.0.0", path = "../n4n5-share/" }
n4n5-ocr = { version = "1.0.0", path = "../n4n5-ocr/" }

[features]
default = ["git-mover"]
git-mover = ["dep:git-mover"]
galion = ["dep:galion"]
